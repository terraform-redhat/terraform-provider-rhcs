inheritance: true
reviews:
  # Restates the dependency review section of AGENTS.md; keep them aligned.
  high_level_summary_instructions: |
    Keep the standard summary of the changes for every pull request.
    When any go.mod changes dependency versions or replacements, including
    Renovate pull requests, also add a "Dependency Impact Report" section
    generated from your own analysis; do not ask the author to provide one.
    For each changed module, state:
    - Old and new versions, or replacement targets, from the diff.
    - Upstream release notes and source comparisons inspected, including
      intermediate releases, or that this evidence was unavailable.
    - Affected usage and call paths in this repository, including code
      outside the diff.
    - Behavior changes that reach those paths, distinguishing source
      inspection from runtime verification.
    - Verification gaps and the targeted checks that would close them.
    The report informs reviewers; it does not approve, block, or enforce
    a merge.
  high_level_summary_in_walkthrough: true
  pre_merge_checks:
    custom_checks:
      - name: "Terraform verification evidence"
        mode: error
        instructions: |
          Apply this check only when the PR changes code under:
          provider/**/*.go, internal/**/*.go,
          subsystem/**/*.go, tests/**/*.go, or tests/**/*.tf.

          Pass only when a PR comment contains a completed copy of
          developer-docs/verification_template.md. It must contain the required
          proof for every applicable checklist item, or a specific technical
          justification for every inapplicable item.

          Fail when the verification template is absent, incomplete, has missing
          required output, or uses a generic justification.
      - name: "E2E coverage"
        mode: error
        instructions: |
          Apply this check only when the PR changes code under:
          provider/**/*.go, internal/**/*.go,
          subsystem/**/*.go, tests/**/*.go, or tests/**/*.tf.

          Pass only when one of these conditions holds:
          - The PR adds or updates relevant coverage under tests/e2e/.
          - Existing, unchanged E2E tests cover the changed behavior.
            The author must identify the test files, test cases, and
            assertions that cover it.
          - A specific technical justification explains why E2E coverage
            does not apply and identifies the narrower test layer
            that verifies the changed behavior.

          Independently verify coverage and justifications against the
          code changes. Confirm that cited tests exercise the modified
          logic and assert the required behavior, including relevant
          setup and profile gates. A test's existence alone is not proof.

          Fail if coverage is missing or stale, or if a justification
          is generic, incorrect, unsupported, or cannot be verified.
          Explain the gap and what evidence or test change is required.
      # Restates the dependency review section of AGENTS.md; keep them aligned.
      - name: "Dependency compatibility evidence"
        mode: error
        instructions: |
          Apply when any go.mod changes dependency versions or replacements,
          including Renovate PRs, even if no provider Go files change.
          Otherwise, pass as not applicable.

          Assess compatibility independently from the PR diff, repository
          source, and upstream release notes and source comparisons. Do not
          require an author-supplied dependency impact report, and do not
          depend on CodeRabbit summary, walkthrough, or review output.

          This check cannot run tests; treat committed tests and linked test
          results only as evidence. For authentication or transport changes,
          inspect the actual Configure/SDK token, client-credentials, refresh
          and OCM request paths and relevant Classic/HCP resource/data-source
          operations. Verify cited subsystem/E2E assertions and
          fixture/manifest/profile wiring; setup-only failures and tests that
          skip the applicable behavior do not establish runtime compatibility.

          Fail only when an upstream change is demonstrated to break an
          affected provider call path, or when a concrete upstream behavior
          change reaches an affected provider call path and neither targeted
          tests that verify the affected supported configurations nor an
          explicit maintainer decision accepting a documented support-policy
          change is present. State the failure condition and the exact
          targeted checks required.

          Report Inconclusive instead of failing when upstream evidence is
          unavailable or incomplete, or when it remains unresolved whether a
          relevant upstream change reaches an affected provider call path;
          name the missing evidence. Do not accept compilation, unrelated CI,
          patch-version bumps, or release-note titles alone as compatibility
          evidence. Do not fail for optional improvements or new features.

          This check evaluates evidence; it does not execute tests or itself
          enforce repository merge protection.
  path_instructions:
    - path: "**/go.mod"
      instructions: |
        For dependency version or replacement changes, perform source-level impact
        analysis even when provider Go files are unchanged, including incidental
        indirect bumps and replacement targets/versions. Do not ask the author for
        a dependency impact report. Inspect upstream release notes AND source
        comparisons across intermediate releases; identify changed defaults,
        affected provider call paths outside the PR diff, and provider
        configuration, environment-variable or schema wiring changes needed to
        preserve supported behavior. Explicitly state unavailable evidence.

        For authentication/transport changes, trace provider/provider.go Schema,
        getAttrValueOrConfig and Provider.Configure into the OCM SDK connection and
        authentication transports: token/access-token, refresh-token and
        client_id/client_secret flows, token renewal, and OCM requests made by
        resource/data-source operations (Classic and HCP as applicable). Inspect
        token and token_url, refresh_token, client_id/client_secret, trusted_cas,
        their actual RHCS_* fallbacks, and the insecure schema attribute; do not
        assume every attribute has an environment fallback. Check TLS minimum
        versions, system certificate trust, custom CAs, proxies, and propagation
        of compatibility options through BOTH token and API transports. Do not
        assume a CLI login or authorization-code flow exists in this provider.

        Inspect relevant tests against actual files: subsystem/classic/,
        subsystem/hcp/, subsystem/framework/, tests/e2e/, tests/tf-manifests/,
        tests/utils/exec/, tests/utils/profilehandler/, and tests/ci/profiles/.
        Verify setup, assertions, fixtures, manifest wiring and profile/skip gates
        exercise the affected supported configurations. Tests failing during setup
        or skipping applicable behavior do not prove runtime compatibility.
        Do not infer compatibility from compilation, unrelated CI, patch-version
        bumps or release-note titles alone. Distinguish source inspection from
        runtime verification and explicitly identify unavailable evidence.

        Follow the dependency review section of AGENTS.md. Raise a blocking
        finding only for a demonstrated incompatibility, or for a concrete
        upstream behavior change that reaches an affected provider call path
        without the targeted compatibility tests needed to verify it; state
        the failure condition and the exact checks required. Report incomplete
        evidence or relevant unresolved upstream changes as warnings. Treat
        optional feature adoption, simplifications, and new features as
        informational. Do not present a conditional risk as a confirmed
        failure.
    - path: "**/*.go"
      instructions: |
        - Follow Effective Go and Go Code Review Comments conventions.
        - Verify imports and formatting are consistent with gofmt and repository rules.
        - Check all errors are handled and wrapped with actionable context where needed.
        - Flag variable shadowing, unnecessary nesting, and unclear naming.
        - Prefer existing repository patterns over introducing new architecture.
        - Ensure no secrets/tokens/credentials are hardcoded or logged.
        - For changed Terraform behavior, inspect related E2E surfaces even when
          they are unchanged: tests/e2e/, tests/tf-manifests/,
          tests/utils/exec/, tests/utils/profilehandler/, and
          tests/ci/profiles/.
        - Decide separately whether the PR requires an E2E test to be added or
          updated, and whether it breaks an existing user-facing E2E contract.
          Flag missing or stale E2E coverage, and flag any changed behavior that
          invalidates an existing E2E assertion, fixture, manifest wiring,
          profile gate, expected diagnostic, or side-effect expectation.
        - Do not treat subsystem coverage as proof that existing E2E behavior
          remains valid.
    - path: "provider/**/*.go"
      instructions: |
        - Review as Terraform Plugin Framework code (not legacy SDK patterns).
        - Validate schema semantics for Required/Optional/Computed/Default and Sensitive flags.
        - In Create/Update, ensure input comes from Plan; in Read, from State.
        - Ensure response state never returns unknown values and RemoveResource is used only in Read for not-found.
        - For nested blocks, verify required attributes are not partially populated.
        - Prefer tflog for provider logging; avoid fmt.Print* debugging.
        - Check import support consistency (ResourceWithImportState, ID validation) where applicable.
    - path: "provider/clusterrosa/classic/**/*.go"
      instructions: |
        - Maintain classic implementation behavior and separation from HCP-specific logic.
        - Call out parity risks where behavior should match HCP resources/data sources.
    - path: "provider/clusterrosa/hcp/**/*.go"
      instructions: |
        - Maintain HCP implementation behavior and separation from classic-specific logic.
        - Call out parity risks where behavior should match classic resources/data sources.
    - path: "subsystem/**/*.go"
      instructions: |
        - Check subsystem tests follow existing patterns with TestServer handlers and Terraform runner flow.
        - Verify behavior-changing code updates have corresponding subsystem coverage.
    - path: "**/*_test.go"
      instructions: |
        - Prefer deterministic tests; avoid flaky timing/order dependencies.
        - Match repository BDD style (Ginkgo/Gomega) and existing helper usage patterns.
        - Ensure assertions cover behavior changes, not only happy paths.
    - path: "Makefile"
      instructions: |
        - Keep targets aligned with CONTRIBUTING/README workflows (fmt, lint, build, pre-push-checks).
        - Watch for tool version drift and duplicated version sources across go.mod, Dockerfiles, and Make variables.
        - Confirm commands are reproducible and do not silently mutate module state in CI-critical paths.
    - path: "**/Dockerfile"
      instructions: |
        - Prefer reproducible image builds; avoid mutating go.mod/go.sum during build unless that is an explicit, documented pattern.
        - Keep Go/toolchain and install steps aligned with go.mod and Makefile (single source of truth).
        - Flag hardcoded tool or base-image versions that will drift from the rest of the repo.
        - No secrets, tokens, or credentials in layers, build args, or comments.
    - path: "examples/**/*.tf"
      instructions: |
        - Match HashiCorp Terraform style for examples (formatting, naming, structure).
        - Use provider/resource naming consistent with this repo (rhcs_*, realistic ROSA/OCM scenarios).
        - No real secrets, tokens, ARNs of customer accounts, or kubeconfigs; use variables and placeholders.
        - Call out when an example should be paired with updates under templates/ or registry docs if behavior or schema changed.
    - path: "tests/**/*.tf"
      instructions: |
        - Match HashiCorp Terraform style; these files are formatted with terraform fmt like examples.
        - No hardcoded credentials; keep test fixtures obviously non-production.
        - Align resource blocks with provider schema and subsystem/e2e expectations.
    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        - Ensure workflow steps match repository make targets and verification gates (see CONTRIBUTING.md).
        - Check pinned action versions and least-privilege permissions where possible.
        - Flag CI changes that diverge from local pre-push checks or skip hooks unintentionally.
        - Do not embed secrets in workflow YAML; use GitHub Actions secrets and OIDC patterns where applicable.
        - For Go/Terraform jobs, ensure toolchain versions align with go.mod and documented prerequisites.
    - path: "*.md"
      instructions: |
        - Verify documentation reflects current commands and version requirements from go.mod and Makefile.
        - Keep wording actionable and consistent with provider terminology (ROSA, OCM, classic/HCP).
    - path: "**/*.md"
      instructions: |
        - AGENTS.md is the hub for AI assistants and review tooling; rules live in developer-docs/; commands live in CONTRIBUTING.md; PR submission checklist is .github/pull_request_template.md.
        - Do not reintroduce .cursor/rules/ as a source of truth; prefer developer-docs/ MUST/WHEN/DEFAULT rules.
  tools:
    checkov:
      enabled: true
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: true
    hadolint:
      enabled: true
    markdownlint:
      enabled: false
    shellcheck:
      enabled: true
    tflint:
      enabled: true
    trivy:
      enabled: true
    yamllint:
      enabled: true
